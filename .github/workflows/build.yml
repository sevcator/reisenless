name: Reisenless Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "udonge/**"
      - "build.py"
      - "config.prop.sample"
      - "config.prop"
      - ".github/actions/setup/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build project
        run: python build.py -vr -c .github/ci.prop all

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s out/app-release.apk
          test -s out/apk-legacy-release.apk
          unzip -tq out/app-release.apk
          unzip -tq out/apk-legacy-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: reisenless-${{ github.sha }}
          path: |
            out/app-release.apk
            out/apk-legacy-release.apk
          if-no-files-found: error
          compression-level: 9

      - name: Stop gradle daemon
        if: always()
        run: ./app/gradlew --stop
