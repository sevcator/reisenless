name: Reisenless Setup
description: Set up the minimal Reisenless build toolchain
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Set up NDK
      shell: bash
      run: python build.py -v ndk
